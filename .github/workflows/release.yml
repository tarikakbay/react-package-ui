name: Release
on: { push: { branches: [main] } }
permissions: { contents: write, packages: write, pull-requests: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        # TODO: scope belirlenince '@cx' yerine GitHub owner adı yazılacak
        with: { node-version: 22, registry-url: https://npm.pkg.github.com, scope: '@cx' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: changesets/action@v1
        with: { publish: pnpm changeset publish }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
